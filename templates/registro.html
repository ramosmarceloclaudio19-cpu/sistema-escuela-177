{% extends "base.html" %}{% block content %}<section class="card"><h1>Registro de personal</h1><p>Completá tus datos una sola vez.</p><form method="post"><label>Nombre y apellido<input name="nombre" required></label><label>DNI<input name="dni" inputmode="numeric" required></label><label>Celular<input name="celular" inputmode="tel" required></label><label>Cargo / función<input name="cargo" required placeholder="Ej.: Docente, Auxiliar"></label><label>Turno<select name="turno"><option>Mañana</option><option>Tarde</option><option>Jornada completa</option></select></label><label>PIN personal de 6 dígitos<input name="pin" inputmode="numeric" minlength="6" maxlength="6" required></label><button class="btn blue">Crear registro</button></form><a class="link" href="/">Volver</a></section>{% endblock %}
